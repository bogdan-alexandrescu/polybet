{% extends "base.html" %}
{% block title %}Settings{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-8">
    <h1 class="text-2xl font-bold text-white">Settings</h1>

    <!-- Login Section -->
    <div id="loginSection" class="bg-slate-800/50 rounded-xl p-6 border border-slate-700/50">
        <h2 class="text-lg font-semibold text-white mb-4">Authentication</h2>
        <div class="flex gap-3">
            <input type="password" id="passwordInput" placeholder="Enter settings password"
                   class="flex-1 bg-slate-900 border border-slate-600 rounded-lg px-4 py-2 text-slate-200 placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
            <button id="unlockBtn" onclick="unlock()"
                    class="px-6 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-medium transition-colors">
                Unlock
            </button>
        </div>
        <p id="authStatus" class="mt-2 text-sm text-slate-500"></p>
    </div>

    <!-- Protected sections (hidden until authenticated) -->
    <div id="protectedSections" class="hidden space-y-8">

        <!-- Schedule Config -->
        <div class="bg-slate-800/50 rounded-xl p-6 border border-slate-700/50">
            <h2 class="text-lg font-semibold text-white mb-4">Refresh Schedule</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Preset</label>
                    <select id="schedulePreset" onchange="applyPreset()"
                            class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2 text-slate-200">
                        <option value="">Select preset...</option>
                        <option value="0 */1 * * *">Every 1 hour</option>
                        <option value="0 */6 * * *">Every 6 hours</option>
                        <option value="0 */12 * * *">Every 12 hours</option>
                        <option value="0 0 * * *">Every 24 hours (midnight)</option>
                        <option value="custom">Custom cron...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Cron Expression</label>
                    <input type="text" id="cronInput" placeholder="0 */6 * * *"
                           class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2 text-slate-200 placeholder-slate-500">
                </div>
            </div>
            <div class="mt-4 flex items-center gap-4">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="scheduleEnabled" class="w-4 h-4 rounded bg-slate-900 border-slate-600 text-indigo-600">
                    <span class="text-sm text-slate-300">Enable scheduled refresh</span>
                </label>
                <button onclick="saveSchedule()"
                        class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium transition-colors">
                    Save Schedule
                </button>
            </div>
            <p id="scheduleStatus" class="mt-2 text-sm text-slate-500"></p>
        </div>

        <!-- Manual Refresh -->
        <div class="bg-slate-800/50 rounded-xl p-6 border border-slate-700/50">
            <h2 class="text-lg font-semibold text-white mb-4">Manual Refresh</h2>
            <div class="flex gap-3 mb-4">
                <button id="startBtn" onclick="startRefresh()"
                        class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-medium transition-colors">
                    Start Refresh
                </button>
                <button id="cancelBtn" onclick="cancelRefresh()" class="hidden px-6 py-2 bg-red-600 hover:bg-red-500 text-white rounded-lg font-medium transition-colors">
                    Cancel
                </button>
            </div>

            <!-- Progress Bar -->
            <div id="progressSection" class="hidden space-y-3">
                <div class="flex items-center justify-between text-sm">
                    <span id="phaseLabel" class="text-slate-400">Initializing...</span>
                    <span id="progressPct" class="text-slate-400">0%</span>
                </div>
                <div class="w-full bg-slate-700 rounded-full h-3 overflow-hidden">
                    <div id="progressBar" class="bg-indigo-500 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>

                <!-- Stats Grid -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-4">
                    <div class="bg-slate-900/50 rounded-lg p-3">
                        <p class="text-xs text-slate-500">Events Processed</p>
                        <p id="statEvents" class="text-lg font-semibold text-white">0</p>
                    </div>
                    <div class="bg-slate-900/50 rounded-lg p-3">
                        <p class="text-xs text-slate-500">Markets</p>
                        <p id="statMarkets" class="text-lg font-semibold text-white">0</p>
                    </div>
                    <div class="bg-slate-900/50 rounded-lg p-3">
                        <p class="text-xs text-slate-500">Snapshots</p>
                        <p id="statSnapshots" class="text-lg font-semibold text-white">0</p>
                    </div>
                    <div class="bg-slate-900/50 rounded-lg p-3">
                        <p class="text-xs text-slate-500">Skipped</p>
                        <p id="statSkipped" class="text-lg font-semibold text-white">0</p>
                    </div>
                </div>

                <p id="refreshError" class="hidden text-sm text-red-400 mt-2"></p>
                <p id="refreshDone" class="hidden text-sm text-emerald-400 mt-2"></p>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let password = sessionStorage.getItem('settings_password') || '';
    let eventSource = null;

    // Auto-unlock if password is stored
    if (password) {
        verifyPassword(password);
    }

    function getHeaders() {
        return { 'X-Settings-Password': password, 'Content-Type': 'application/json' };
    }

    async function unlock() {
        const pw = document.getElementById('passwordInput').value;
        await verifyPassword(pw);
    }

    async function verifyPassword(pw) {
        try {
            const resp = await fetch('/api/settings', { headers: { 'X-Settings-Password': pw } });
            if (resp.ok) {
                password = pw;
                sessionStorage.setItem('settings_password', pw);
                document.getElementById('protectedSections').classList.remove('hidden');
                document.getElementById('authStatus').textContent = 'Authenticated';
                document.getElementById('authStatus').className = 'mt-2 text-sm text-emerald-400';
                loadSettings();
                checkRefreshStatus();
            } else {
                document.getElementById('authStatus').textContent = 'Invalid password';
                document.getElementById('authStatus').className = 'mt-2 text-sm text-red-400';
            }
        } catch (e) {
            document.getElementById('authStatus').textContent = 'Connection error';
            document.getElementById('authStatus').className = 'mt-2 text-sm text-red-400';
        }
    }

    async function loadSettings() {
        try {
            const resp = await fetch('/api/settings', { headers: getHeaders() });
            if (resp.ok) {
                const data = await resp.json();
                if (data.cron_schedule) {
                    document.getElementById('cronInput').value = data.cron_schedule;
                }
                document.getElementById('scheduleEnabled').checked = data.schedule_enabled === 'true';
            }
        } catch (e) { /* ignore */ }
    }

    function applyPreset() {
        const val = document.getElementById('schedulePreset').value;
        if (val && val !== 'custom') {
            document.getElementById('cronInput').value = val;
        }
    }

    async function saveSchedule() {
        const cron = document.getElementById('cronInput').value;
        const enabled = document.getElementById('scheduleEnabled').checked;
        try {
            const resp = await fetch('/api/settings', {
                method: 'POST',
                headers: getHeaders(),
                body: JSON.stringify({ cron_schedule: cron, schedule_enabled: String(enabled) }),
            });
            if (resp.ok) {
                document.getElementById('scheduleStatus').textContent = 'Schedule saved';
                document.getElementById('scheduleStatus').className = 'mt-2 text-sm text-emerald-400';
            } else {
                document.getElementById('scheduleStatus').textContent = 'Failed to save';
                document.getElementById('scheduleStatus').className = 'mt-2 text-sm text-red-400';
            }
        } catch (e) {
            document.getElementById('scheduleStatus').textContent = 'Connection error';
            document.getElementById('scheduleStatus').className = 'mt-2 text-sm text-red-400';
        }
    }

    async function startRefresh() {
        try {
            const resp = await fetch('/api/refresh/start', {
                method: 'POST',
                headers: getHeaders(),
            });
            if (resp.ok) {
                showProgress();
                connectSSE();
            } else {
                const data = await resp.json();
                alert(data.error || 'Failed to start refresh');
            }
        } catch (e) {
            alert('Connection error');
        }
    }

    async function cancelRefresh() {
        try {
            await fetch('/api/refresh/cancel', {
                method: 'POST',
                headers: getHeaders(),
            });
        } catch (e) { /* ignore */ }
    }

    async function checkRefreshStatus() {
        try {
            const resp = await fetch('/api/refresh/status');
            if (resp.ok) {
                const state = await resp.json();
                if (state.running) {
                    showProgress();
                    connectSSE();
                }
            }
        } catch (e) { /* ignore */ }
    }

    function showProgress() {
        document.getElementById('progressSection').classList.remove('hidden');
        document.getElementById('startBtn').classList.add('hidden');
        document.getElementById('cancelBtn').classList.remove('hidden');
        document.getElementById('refreshDone').classList.add('hidden');
        document.getElementById('refreshError').classList.add('hidden');
    }

    function hideProgress() {
        document.getElementById('startBtn').classList.remove('hidden');
        document.getElementById('cancelBtn').classList.add('hidden');
    }

    function connectSSE() {
        if (eventSource) eventSource.close();
        eventSource = new EventSource('/api/refresh/stream');
        eventSource.onmessage = (e) => {
            const state = JSON.parse(e.data);
            updateUI(state);
            if (!state.running) {
                eventSource.close();
                eventSource = null;
                hideProgress();
            }
        };
        eventSource.onerror = () => {
            eventSource.close();
            eventSource = null;
            // Fallback to polling
            pollStatus();
        };
    }

    async function pollStatus() {
        try {
            const resp = await fetch('/api/refresh/status');
            if (resp.ok) {
                const state = await resp.json();
                updateUI(state);
                if (state.running) {
                    setTimeout(pollStatus, 1000);
                } else {
                    hideProgress();
                }
            }
        } catch (e) {
            setTimeout(pollStatus, 2000);
        }
    }

    const phaseLabels = {
        'fetching_open': 'Fetching open events...',
        'fetching_closed': 'Fetching closed events...',
        'upserting': 'Processing events & markets...',
        'building_tags': 'Rebuilding tag index...',
        'done': 'Refresh complete!',
        'cancelled': 'Refresh cancelled',
        'error': 'Error occurred',
    };

    function updateUI(state) {
        const pct = state.total_events > 0
            ? Math.round((state.processed_events / state.total_events) * 100)
            : (state.phase === 'done' ? 100 : 0);

        document.getElementById('phaseLabel').textContent = phaseLabels[state.phase] || state.phase;
        document.getElementById('progressPct').textContent = pct + '%';
        document.getElementById('progressBar').style.width = pct + '%';

        document.getElementById('statEvents').textContent = state.processed_events.toLocaleString();
        document.getElementById('statMarkets').textContent = state.new_markets.toLocaleString();
        document.getElementById('statSnapshots').textContent = state.snapshots.toLocaleString();
        document.getElementById('statSkipped').textContent = state.skipped_events.toLocaleString();

        if (state.phase === 'done') {
            document.getElementById('progressBar').classList.remove('bg-indigo-500');
            document.getElementById('progressBar').classList.add('bg-emerald-500');
            document.getElementById('refreshDone').textContent = `Refresh completed at ${state.finished_at}`;
            document.getElementById('refreshDone').classList.remove('hidden');
        } else if (state.phase === 'error') {
            document.getElementById('progressBar').classList.remove('bg-indigo-500');
            document.getElementById('progressBar').classList.add('bg-red-500');
            document.getElementById('refreshError').textContent = `Error: ${state.error}`;
            document.getElementById('refreshError').classList.remove('hidden');
        } else if (state.phase === 'cancelled') {
            document.getElementById('progressBar').classList.remove('bg-indigo-500');
            document.getElementById('progressBar').classList.add('bg-yellow-500');
            document.getElementById('refreshDone').textContent = 'Refresh was cancelled';
            document.getElementById('refreshDone').classList.remove('hidden');
        } else {
            document.getElementById('progressBar').classList.add('bg-indigo-500');
            document.getElementById('progressBar').classList.remove('bg-emerald-500', 'bg-red-500', 'bg-yellow-500');
        }
    }
</script>
{% endblock %}
